{% macro field_label(text, for_id='', hint='', id='', extra_class='', style='') %}
<label{% if id %} id="{{ id }}"{% endif %}{% if for_id %} for="{{ for_id }}"{% endif %} class="fieldLabel{% if extra_class %} {{ extra_class }}{% endif %}"{% if style %} style="{{ style }}"{% endif %}>{{ text }}{% if hint %} <span style="font-weight: 400; color: var(--mt);">({{ hint }})</span>{% endif %}</label>
{% endmacro %}
